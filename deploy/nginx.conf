# Подставляется в /etc/nginx/sites-available/tg-chat-videos скриптом install.sh.
# TLS: certbot --nginx -d DOMAIN после установки.
server {
    listen 80;
    server_name DOMAIN;

    # Статика — напрямую с диска, с кэшем на день (в HTML ссылки без версии, поэтому не дольше).
    location /static/ {
        alias /opt/tg-chat-videos/tgchannel/static/;
        expires 1d;
        add_header Cache-Control "public";
    }

    location / {
        proxy_pass http://127.0.0.1:PORT;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
