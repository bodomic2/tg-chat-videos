<!doctype html>
<html lang="{{ lang }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}{{ t('site') }}{% endblock %}</title>
<link rel="stylesheet" href="{{ static_url('style.css') }}">
<script>
// Тема до первой отрисовки, чтобы не мигало: auto | light | dark в localStorage.
(function () {
  try { var t = localStorage.getItem('theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch (e) {}
})();
</script>
</head>
<body>
<header>
  <nav>
    <a href="{{ url_for('catalog') }}" {% if request.endpoint == 'catalog' %}class="active"{% endif %}>{{ t('nav_catalog') }}</a>
    <a href="{{ url_for('concerts') }}" {% if request.endpoint in ('concerts', 'concert') %}class="active"{% endif %}>{{ t('nav_concerts') }}</a>
    <a href="{{ url_for('musicians') }}" {% if request.endpoint in ('musicians', 'musician') %}class="active"{% endif %}>{{ t('nav_musicians') }}</a>
    <span class="langs">{% for code in langs %}<a href="{{ url_for('set_lang', code=code, next=request.full_path) }}" {% if code == lang %}class="active"{% endif %}>{{ code | upper }}</a>{% endfor %}</span>
    <button type="button" id="theme" class="theme" title="{{ t('theme') }}">◐</button>
  </nav>
</header>
<main>
{% block content %}{% endblock %}
</main>
<footer>{{ t('footer', site='<a href="https://thejammers.org/archive">thejammers.org</a>') | safe }}</footer>
<script>
// Видео прямо на странице: официальный Post Widget телеграма, по клику на ▶.
// Скрипт вставляется один раз на видео и сам подменяется на iframe с постом.
(function () {
  document.addEventListener('click', function (e) {
    var btn = e.target.closest('.play');
    if (!btn) return;
    var box = btn.closest('li').querySelector('.embed');
    if (!box) return;
    if (box.dataset.loaded) { box.hidden = !box.hidden; btn.classList.toggle('on', !box.hidden); return; }
    var s = document.createElement('script');
    s.async = true;
    s.src = 'https://telegram.org/js/telegram-widget.js?22';
    s.setAttribute('data-telegram-post', btn.dataset.post);
    s.setAttribute('data-width', '100%');
    if (document.documentElement.dataset.theme === 'dark' ||
        (!document.documentElement.dataset.theme && matchMedia('(prefers-color-scheme: dark)').matches)) {
      s.setAttribute('data-dark', '1');
    }
    box.appendChild(s);
    box.dataset.loaded = '1';
    box.hidden = false;
    btn.classList.add('on');
  });
})();

// Кнопка темы: по кругу auto → dark → light. Значок показывает текущий режим.
(function () {
  var btn = document.getElementById('theme'), order = ['auto', 'dark', 'light'], icons = {auto: '◐', dark: '☾', light: '☀'};
  function current() { try { return localStorage.getItem('theme') || 'auto'; } catch (e) { return 'auto'; } }
  function apply(mode) {
    if (mode === 'auto') delete document.documentElement.dataset.theme; else document.documentElement.dataset.theme = mode;
    btn.textContent = icons[mode];
  }
  apply(current());
  btn.addEventListener('click', function () {
    var next = order[(order.indexOf(current()) + 1) % order.length];
    try { localStorage.setItem('theme', next); } catch (e) {}
    apply(next);
  });
})();
</script>
</body>
</html>
